name: Site

# Cloudflare Workers Builds deploys main and builds a preview for every branch.
# This workflow only checks pull requests: build plus internal links.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Release pages read the GitHub releases of foresi/foresi; the token only raises the rate limit.
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run check:links
